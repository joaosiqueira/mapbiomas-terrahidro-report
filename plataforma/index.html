/* Global (styles.css) */

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg-page);
  color: var(--text-primary);
}

a { color: var(--accent-link); text-decoration: none; }
a:hover { color: var(--accent-strong); text-decoration: underline; }

/* Rolagem do sistema: alça clara neutral-300, trilha invisível, sem divisória — a barra existe
   para dizer onde você está, não para desenhar uma coluna ao lado do conteúdo. Vale para todo
   scroll do projeto; só sobreponha quando a superfície for escura. */
* { scrollbar-width: thin; scrollbar-color: var(--color-neutral-300) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; border: 0; }
*::-webkit-scrollbar-thumb { background: var(--color-neutral-300); border-radius: 100px; border: 2px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--color-neutral-400); background-clip: content-box; }
*::-webkit-scrollbar-corner { background: transparent; }

/* ====================================================================
   Camada de relatório — blocos de página longa (site, relatório, doc).
   Só tokens: todas as cores respondem ao tema claro e ao escuro.
   ==================================================================== */

/* ---------- barra ---------- */
.mb-rp-bar { background: var(--color-neutral-200); border-bottom: 1px solid var(--color-neutral-300); padding: 0 16px; }
.mb-rp-bar-in { margin: 0 auto; min-height: 56px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.mb-rp-mark { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -.2px; color: var(--color-neutral-1000); }
.mb-rp-bar-sep { width: 1px; height: 20px; background: var(--color-neutral-300); }
.mb-rp-bar-title { font: var(--body-medium-strong); color: var(--color-neutral-900); }
.mb-rp-bar-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* SegmentedControl, variante bordered small: é a que vale sobre fundo cinza. */
.mb-rp-seg { display: inline-flex; align-items: center; gap: 2px; padding: 2px; height: 30px;
  background: var(--color-neutral-100); border: 1px solid var(--color-neutral-300);
  border-radius: var(--border-radius-large); width: fit-content; }
.mb-rp-seg button, .mb-rp-seg a { appearance: none; box-sizing: border-box; display: inline-flex;
  align-items: center; justify-content: center; height: 24px; min-width: 24px; padding: 4px 12px;
  border: 0; border-radius: var(--border-radius-medium); background: transparent; cursor: pointer;
  font: var(--body-small); color: var(--color-neutral-900); text-decoration: none;
  transition: background-color var(--transition-default), color var(--transition-default); }
.mb-rp-seg button[aria-pressed="true"], .mb-rp-seg a[aria-current="page"] {
  background: var(--color-primary-200); color: var(--color-primary-800); font-weight: 700; }
.mb-rp-seg button:hover:not([aria-pressed="true"]), .mb-rp-seg a:hover:not([aria-current="page"]) {
  background: var(--color-primary-100); }

/* ---------- coluna de leitura ---------- */
.mb-rp-wrap { margin: 0 auto; padding: 40px 16px 80px; }
.mb-rp-section { margin-bottom: 56px; }
.mb-rp-section:last-child { margin-bottom: 0; }
.mb-rp-eyebrow { font: var(--body-note-strong); text-transform: uppercase; letter-spacing: .72px;
  color: var(--color-neutral-600); margin: 0 0 12px; }
.mb-rp-h1, .mb-rp-h2, .mb-rp-h3 { margin: 0 0 10px; font-weight: 700; color: var(--color-neutral-900); text-wrap: pretty; }
.mb-rp-h1 { font-size: clamp(28px, 5.4vw, 40px); line-height: 1.15; letter-spacing: -.02em; text-wrap: balance; }
.mb-rp-h2 { font-size: clamp(25px, 4.4vw, 32px); line-height: 1.19; letter-spacing: -.01em; }

.mb-rp-pill.ok { background: var(--color-status-active-bg); color: var(--color-status-active-fg); }
.mb-rp-pill.warn { background: var(--color-status-pending-bg); color: var(--color-status-pending-fg); }
.mb-rp-pill.bad { background: var(--color-status-failed-bg); color: var(--color-status-failed-fg); }
.mb-rp-pill.info { background: var(--color-status-info-bg); color: var(--color-status-info-fg); }

/* ---------- painel de métricas ---------- */
.mb-rp-panel { background: var(--color-neutral-100); border: 1px solid var(--color-neutral-300);
  border-radius: var(--border-radius-xlarge); box-shadow: var(--shadow-medium); overflow: hidden; }
.mb-rp-panel-hd { background: var(--color-neutral-200); border-bottom: 1px solid var(--color-neutral-300);
  padding: 12px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mb-rp-panel-hd h3 { margin: 0; font: var(--body-medium-strong); color: var(--color-neutral-900); }
.mb-rp-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 1px; background: var(--color-neutral-300); }
.mb-rp-metric { background: var(--color-neutral-100); padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.mb-rp-metric-l { font: var(--body-note-strong); text-transform: uppercase; letter-spacing: .72px; color: var(--color-neutral-700); }
.mb-rp-metric-v { font: var(--body-large-strong); color: var(--color-neutral-1000); font-variant-numeric: tabular-nums; }
.mb-rp-metric-n { font: var(--body-note); color: var(--color-neutral-600); }

/* ---------- passos ---------- */
.mb-rp-flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.mb-rp-step { border: 1px solid var(--color-neutral-300); border-radius: var(--border-radius-large);
  padding: 12px; background: var(--color-neutral-100); display: flex; flex-direction: column; gap: 6px; }
.mb-rp-step.done { background: var(--color-primary-100); border-color: var(--color-action-soft-border); }
.mb-rp-step-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mb-rp-step-k { font: var(--body-note-strong); text-transform: uppercase; letter-spacing: .72px; color: var(--color-action-bg); }
.mb-rp-step-t { font: var(--body-small-strong); color: var(--color-neutral-1000); }
.mb-rp-step-d { font: var(--body-note); color: var(--color-neutral-600); }

/* ---------- riscos e observações ---------- */
.mb-rp-risks { display: flex; flex-direction: column; gap: 8px; }
.mb-rp-risk { border: 1px solid var(--color-neutral-300); border-radius: var(--border-radius-large);
  padding: 12px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start;
  background: var(--color-neutral-100); transition: border-color var(--transition-default); }
.mb-rp-risk:hover { border-color: var(--color-action-soft-border); }
.mb-rp-risk > .mb-rp-pill { grid-row: 1 / 3; align-self: start; }
.mb-rp-risk-t { grid-column: 2; font: var(--body-small-strong); color: var(--color-neutral-1000); }
.mb-rp-risk-b { grid-column: 2; margin: 0 !important; font-size: 16px !important; line-height: 26px !important; color: var(--color-neutral-700) !important; }
.mb-rp-fix { grid-column: 2; margin: 2px 0 0 !important; font: var(--body-note-strong) !important;
  color: var(--color-action-bg) !important; }

/* ---------- aviso ---------- */
.mb-rp-note { background: var(--color-warning-200); border: 1px solid var(--color-warning-300);
  border-radius: var(--border-radius-medium); padding: 14px 16px; color: var(--color-warning-800);
  font-size: 16px; line-height: 26px; }
.mb-rp-note strong { color: inherit; }
.mb-rp-note.neutral { background: var(--color-neutral-200); border-color: var(--color-neutral-300); color: var(--color-neutral-800); }

/* ---------- tabelas ---------- */

.mb-rp-table th { background: var(--color-neutral-200); text-align: left; font: var(--body-note-strong);
  text-transform: uppercase; letter-spacing: .72px; color: var(--color-neutral-600);
  padding: 10px 16px; border-bottom: 1px solid var(--color-neutral-300); white-space: nowrap; }
.mb-rp-table td { padding: 10px 16px; border-bottom: 1px solid var(--color-neutral-300);
  color: var(--color-neutral-800); vertical-align: top; }

.mb-rp-table td.n, .mb-rp-table th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mb-rp-table td.em { color: var(--color-neutral-1000); font-weight: 700; }

/* ---------- figuras e gráficos ---------- */
.mb-rp-figure { margin: 0; }
.mb-rp-figure figcaption { font: var(--body-note); color: var(--color-neutral-600); margin-top: 8px; }
.mb-rp-chartbox { position: relative; }
.mb-rp-chart { width: 100%; height: auto; display: block; overflow: visible; }
.mb-rp-ax { font-size: 12px; fill: var(--color-neutral-600); font-family: var(--font-family-base); }
.mb-rp-axl { stroke: var(--color-neutral-300); stroke-width: 1; }
.mb-rp-lb { font-size: 12px; fill: var(--color-neutral-800); font-family: var(--font-family-base); }
.mb-rp-vl { font-size: 12px; font-weight: 700; fill: var(--color-neutral-1000);
  font-family: var(--font-family-base); font-variant-numeric: tabular-nums; }
.mb-rp-seg-r { transition: opacity var(--transition-default); }
.mb-rp-seg-r.dim { opacity: .38; }
.mb-rp-legend-row { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 10px; }
.mb-rp-key { display: inline-flex; align-items: center; gap: 6px; font: var(--body-note); color: var(--color-neutral-800);
  transition: opacity var(--transition-default); }
.mb-rp-key.dim { opacity: .45; }
.mb-rp-sw { width: 10px; height: 10px; border-radius: var(--border-radius-small); flex: 0 0 auto; }
.mb-rp-key-v { font: var(--body-note-strong); color: var(--color-neutral-1000); font-variant-numeric: tabular-nums; }
.mb-rp-chart-note { font: var(--body-note) !important; color: var(--color-neutral-600) !important; margin: 8px 0 0 !important; }
.mb-rp-tip { position: absolute; transform: translate(-50%, -140%); pointer-events: none;
  background: var(--color-tooltip-bg); color: var(--color-tooltip-fg); border-radius: var(--border-radius-medium);
  padding: 6px 10px; font: var(--body-note); white-space: nowrap; z-index: var(--z-index-tooltip);
  display: flex; flex-direction: column; gap: 2px; }
.mb-rp-tip-v { font: var(--body-note-strong); font-variant-numeric: tabular-nums; }

/* ---------- grades auxiliares ---------- */
.mb-rp-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
.mb-rp-three { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }

/* ====================================================================

/* cabeçalho de artigo */
.mb-rp-arthd { padding: 64px 0 32px; border-bottom: 1px solid var(--color-neutral-300); }
.mb-rp-arthd .mb-rp-h1 { margin-bottom: 0; }
.mb-rp-dek { font: var(--body-small) !important; color: var(--color-neutral-600) !important;
  margin: 16px 0 0 !important; max-width: 64ch; }

/* números-chave: sem card, separados por filete de 1px */
.mb-rp-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  border-bottom: 1px solid var(--color-neutral-300); position: relative; }
/* A faixa de 1px tapa o filete da primeira coluna — de todas as linhas, não só da primeira,

.mb-rp-kpis::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px;

.mb-rp-kpi-l { font: var(--body-note); color: var(--color-neutral-600); margin-top: 8px; }

/* resumo */

.mb-rp-kw { font: var(--body-note) !important; color: var(--color-neutral-600) !important;

.mb-rp-kw b { display: block; margin-bottom: 4px; font: var(--body-note-strong);

.mb-rp-steps { list-style: none; padding: 0; margin: 24px 0 0; counter-reset: mbrpstep; }
.mb-rp-steps li { counter-increment: mbrpstep; padding: 16px 0 16px 52px; position: relative;
  border-top: 1px solid var(--color-neutral-300); }
.mb-rp-steps li::before { content: counter(mbrpstep); position: absolute; left: 0; top: 16px;
  width: 28px; height: 28px; border: 1px solid var(--color-neutral-300);

.mb-rp-callout.warn { background: var(--color-warning-200); border-color: var(--color-warning-300);

omprimento de canal dentro do polígono: a rede LiDAR inteira, a rede a partir da ordem 3 (o corte padrão do filtro), a FBDS e o IBGE. A rede LiDAR é de ": "Table 5 breaks the comparison down by system, in channel length inside the polygon: the whole LiDAR network, the network from order 3 (the default filter cut), FBDS and IBGE. The LiDAR network is ", "A Tabela 8 junta as duas medidas que interessam para o uso da rede: a ": "Table 8 puts together the two measures that matter for using the network: the ", "A borda sem LiDAR não pode ser saída": "The edge without LiDAR cannot be an outlet", "A cadeia passo a passo numa grade de brinquedo com três partes, calculada com a lógica do código de produção (busca a montante em C, parede, injeção, sementes): a área no exutório e em toda célula da parte de baixo é igual à do processamento inteiro (docs/figures/build_cadeia_figures.py).": "The chain step by step on a toy grid with three parts, computed with the production code logic (upstream search in C, wall, injection, seeds): the area at the outlet and in every cell of the downstream part equals that of the whole processing (docs/figures/build_cadeia_figures.py).", "A cadeia resolve a memória:": "The chain solves memory:", "A correção de vegetação não fez diferença na fusão": "Vegetation correction made no difference in the fusion", "A densidade da FBDS (": "The FBDS density (", "A escala da BHO é 1:100.000": "The BHO scale is 1:100,000", "A faixa foi medida a partir do eixo do canal, não da borda da calha": "The strip was measured from the channel centerline, not from the edge of the channel bed", "A fusão funciona a 0,5 m": "Fusion works at 0.5 m", "A fusão reproduziu o LiDAR com os três MDTs, desde que o divisor esteja no LiDAR": "Fusion reproduced the LiDAR with all three DTMs, as long as the divide is within the LiDAR", "A fusão à la Gallant (2019) num exemplo calculado com o código do teste: o LiDAR fica intocado; o MDT de 30 m recebe o deslocamento mediano e a difere R foram processados ao mesmo tempo, uma VM da GCP para cada um, e vetorizados com 26 atributos por trecho.": "The pilot was redone on the country's official hydrographic base. Each system is a level 7 Otto basin of the ANA BHO 6 together with all the basins that drain into it, so that no water enters from outside. The 14 systems with at least 95% LiDAR coverage were processed at the same time, one GCP VM for each, and vectorized with 26 attributes per reach.", "O pipeline é o mesmo, com as correções feitas no piloto já embutidas: ": "The pipeline is the same, with the corrections made in the pilot already built in: ", "O processamento parte só do MDT LiDAR. As unidades vêm das ottobacias da ANA, os produtos saem do TerraHidro e da vetorização própria, e a hidrografia da FBDS e do IBGE serve de comparação.": "Processing starts from the LiDAR DTM alone. The units come from the ANA Otto basins, the products come from TerraHidro and our own vectorization, and the FBDS and IBGE hydrography serve as comparison.", "O que a rede mostra quando comparada à hidrografia mapeada (FBDS e IBGE), a APP de 30 m e os achados que mudam a leitura dos dados.": "What the network shows when compared with the mapped hydrography (FBDS and IBGE), the 30 m APP and the findings that change how the data should be read.", "O que custou produzir: as VMs, as horas de processamento e as cobradas, o custo real, o tempo de cada passo e a memória.": "What it cost to produce: the VMs, the processing and billed hours, the actual cost, the time of each step and the memory.", "O que falta para o restante do LiDAR": "What is missing for the rest of the LiDAR", "O que muda a leitura dos produtos": "What changes how the products are read", "O que é": "What it is", "O recorte inclui 1 km além do polígono, então a rede se divide em ": "The clip includes 1 km beyond the polygon, so the network is split into ", "O removepits impõe ": "removepits imposes ", "O removepits ocupa um núcleo só, então a VM grande pedida pela RAM fica ociosa na maior parte do tempo. ": "removepits uses a single core, so the large VM requested for its RAM sits idle most of the time. ", "O sistema ": "System ", "O sistema 4633563 tem dois exutórios, e o divisor entre eles cai na parte escondida. Com 20% escondido, a fusão erra ": "System 4633563 has two outlets, and the divide between them falls in the hidden part. With 20% hidden, fusion is off by ", "O threshold de ": "The threshold of ", "O valor faturado sai do faturamento do projeto mapbiomas, filtrando pelos rótulos ": "The billed amount comes from the mapbiomas project billing, filtered by the labels ", "Objetivo": "Goal", "Onde o tempo foi gasto, ": "Where the time was spent, ", "Ordem": "Order", "Ordem ": "Order ", "Ordem 7 / 8": "Order 7 / 8", "Ordem 7 / 8:": "Order 7 / 8:", "Ordem de Strahler": "Strahler order", "Ordem de Strahler, topologia, comprimento, declividade e qualidade de cada trecho; base das tabelas, figuras e mapas.": "Strahler order, topology, length, slope and quality of each reach; basis of the tables, figures and maps.", "Ordens 1 a 3 trazem no mapa só os atributos essenciais; a tabela completa está no .zip do sistema.": "Orders 1 to 3 show only the essential attributes on the map; the full table is in the system's .zip.", "Os ": "The ", "Os campos são calculados na vetorização (scripts/drenagem_vetorial.py) a partir dos rasters do TerraHidro: o traçado e o comprimento vêm da drenagem e dos segmentos; as cotas, do MDT sem depressões (pitless); a área de contribuição, do raster de área acumulada; a área própria de cada trecho, das minibacias. A Tabela 15 agrupa os campos e dá os percentis 5, 50 e 95 de cada um sobre os ": "The fields are computed during vectorization (scripts/drenagem_vetorial.py) from the TerraHidro rasters: the course and length come from the drainage and segments; the elevations, from the depressionless DTM (pitless); the drainage area, from the accumulated-area raster; each reach's own area, from the
